[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-tr"
version = "1.1.0"
description = "Literary-quality EPUB translator focused on Turkish, with free engines (OpenCode, Google, Argos, Ollama, ...)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Cuma Bozkurt"}]
requires-python = ">=3.10"
keywords = ["epub", "ebook", "translation", "turkish", "llm", "ollama", "opencode", "machine-translation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Turkish",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["ebooklib>=0.18", "lxml>=4.9", "beautifulsoup4>=4.12", "requests>=2.28", "deep-translator>=1.11", "tqdm>=4.60"]

[project.optional-dependencies]
argos = ["argostranslate>=1.9"]
extra = ["translators>=5.9"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "build>=1", "codespell>=2.3", "twine>=5"]

[project.urls]
Homepage = "https://github.com/cumabozkurt/epub-tr"
Documentation = "https://github.com/cumabozkurt/epub-tr#readme"
Issues = "https://github.com/cumabozkurt/epub-tr/issues"
Changelog = "https://github.com/cumabozkurt/epub-tr/blob/main/CHANGELOG.md"

[project.scripts]
epub-tr = "epub_tr.cli:main"

[tool.setuptools]
packages = ["epub_tr", "epub_tr.engines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: needs internet access (deselected by default in CI: -m 'not network')"]

[tool.coverage.run]
source = ["epub_tr"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["out", "samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
# B904: re-raising engine errors without `from` is intentional; B905: zip() strictness would change behaviour;
# UP031: %-formatting kept in lxml namespace templates
ignore = ["B904", "B905", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.codespell]
# Turkish prose (README.tr.md, *.tr.md, prompts, translated samples) is not English
skip = "./out,./samples,./.venv,./.git,*.epub,*.egg-info,*.tr.md,./build,./dist"
ignore-words-list = "siz,sizin,sistem,paralel,blok,manger,bu"
