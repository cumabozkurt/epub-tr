name: Release

# Push a tag vX.Y.Z (scripts/release.py does it) → tests run, sdist + wheel are built, and the GitHub
# release is created with notes from CHANGELOG.md + CHANGELOG.tr.md and the files + SHA256SUMS.txt attached.
# If the repository secret PYPI_API_TOKEN exists, the same files are then uploaded to PyPI; without it the
# PyPI job is skipped with a notice. Run it manually with an existing tag to (re)publish an older release.
# Trusted publishing (no token) is the documented alternative, see docs/AUTOMATION.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v1.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$TAG" || { echo "tag $TAG vs pyproject $v"; exit 1; }
          grep -q "__version__ = \"$v\"" epub_tr/__init__.py
      - run: python -m pip install --upgrade pip build twine && python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q -m "not network"
      - run: python -m build && python -m twine check --strict dist/*
      - name: Checksums and notes
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          python scripts/release_notes.py "$TAG" > notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/
            notes.md

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$REPO" --notes-file notes.md
            gh release upload "$TAG" -R "$REPO" dist/* --clobber
          else
            gh release create "$TAG" -R "$REPO" --title "epub-tr ${TAG#v}" --notes-file notes.md --verify-tag dist/*
          fi
      - name: Verify assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          v=${TAG#v}
          names=$(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name')
          echo "$names"
          for f in "epub_tr-$v-py3-none-any.whl" "epub_tr-$v.tar.gz" SHA256SUMS.txt; do
            echo "$names" | grep -qx "$f" || { echo "missing asset $f"; exit 1; }
          done

  pypi:
    name: Publish to PyPI (when PYPI_API_TOKEN is set)
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Is the PYPI_API_TOKEN secret configured?
        id: token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PyPI skipped::PYPI_API_TOKEN secret is not set, so nothing was uploaded to PyPI."
          fi
      - uses: actions/download-artifact@v8
        if: steps.token.outputs.present == 'true'
        with:
          name: release
      - uses: actions/setup-python@v7
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.13"
      - name: Upload sdist + wheel with twine
        if: steps.token.outputs.present == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python -m twine upload --non-interactive --skip-existing dist/*.whl dist/*.tar.gz
      - name: Verify the release installs from PyPI
        if: steps.token.outputs.present == 'true'
        run: |
          v=${TAG#v}
          for i in $(seq 1 20); do
            curl -fsS "https://pypi.org/pypi/epub-tr/$v/json" >/dev/null && break
            echo "waiting for PyPI ($i)…"; sleep 15
          done
          python -m venv /tmp/pypi-check
          /tmp/pypi-check/bin/pip install --no-cache-dir "epub-tr==$v"
          /tmp/pypi-check/bin/epub-tr --version
          echo "::notice title=PyPI::https://pypi.org/project/epub-tr/$v/"
